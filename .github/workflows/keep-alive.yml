name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -o /dev/null -w "%{http_code}\n" \
            "https://nqfrmceiwchaeyjlgvil.supabase.co/rest/v1/shml_plugins?select=id&limit=1" \
            -H "apikey: sb_publishable_zvWjyDspvXIOt4tJY5cEwA_lsMmw5rs"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repository active (Prevent 60-day disable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep workflow alive"
          git push
